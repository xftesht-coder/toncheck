server {
    server_name allocation.neochoice.ru;
    root /opt/allocation-system/frontend;
    index index.html;

    location /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; }
    include /etc/nginx/snippets/auth.conf;

    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/(api|docs|openapi.json|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/neochoice.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neochoice.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = allocation.neochoice.ru) { return 301 https://$host$request_uri; }
    listen 80; server_name allocation.neochoice.ru; return 404;
}
