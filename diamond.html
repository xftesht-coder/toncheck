<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💎 NeoChoice Diamond Mail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63 50%,#24243e);min-height:100vh;color:#fff;padding:40px 16px}
.wrap{max-width:880px;margin:0 auto}
.logo{text-align:center;font-size:44px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#e0e7ff,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#a5b4fc;margin:8px 0 32px}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px;margin-bottom:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.f{margin-bottom:14px}
label{display:block;color:#c4b5fd;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font:inherit;transition:.25s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#a78bfa;box-shadow:0 0 0 4px rgba(167,139,250,.12)}
select option{color:#000}
textarea{min-height:130px;resize:vertical}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(118,75,162,.45)}
.res{display:none;border:1px solid rgba(167,139,250,.35);background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(99,102,241,.08));border-radius:20px;padding:28px;animation:fade .5s}
.res.show{display:block}
.dia{text-align:center;font-size:26px;letter-spacing:16px;opacity:.7;margin:14px 0}
